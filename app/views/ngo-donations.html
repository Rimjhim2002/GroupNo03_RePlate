<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RePlate — Available Donations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F9FC;
    --navy: #0B2545;
    --blue: #1D4ED8;
    --slate: #8DA9C4;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--navy); min-height: 100vh; }
 
  .topbar {
    background: var(--navy); color: var(--white); padding: 18px 40px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand-mark { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 20px; }
  .brand-mark span { color: var(--slate); }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .nav-links { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .topbar-user {
    font-size: 12px;
    color: var(--white);
    background: transparent;
    border: 1.5px solid rgba(255,255,255,0.25);
    padding: 7px 16px;
    border-radius: 7px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    line-height: 1.2;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  .back-link, .logout-btn, .nav-link {
    background: transparent; border: 1.5px solid rgba(255,255,255,0.25); color: var(--white);
    padding: 7px 16px; border-radius: 7px; font-family: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer; text-decoration: none; transition: all 0.15s ease;
    display: inline-block;
    line-height: 1.2;
  }
  .back-link:hover, .logout-btn:hover, .nav-link:hover { border-color: var(--white); background: rgba(255,255,255,0.08); }
 
  .page { max-width: 700px; margin: 0 auto; padding: 40px 32px 80px; }
  .page-header { margin-bottom: 32px; }
  .page-header h1 { font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }
  .page-header p { color: #5A7189; font-size: 14px; margin-top: 6px; }
 
  .error-msg {
    display: none; background: #FDECEC; color: #B42318; border: 1px solid #F5C2C0;
    padding: 10px 13px; border-radius: 8px; font-size: 13px; margin-bottom: 16px;
  }
  .error-msg.visible { display: block; }
 
  .listing-card {
    background: var(--white); border: 1px solid #E4E9F2; border-radius: 14px; padding: 20px;
    display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px;
  }
  .listing-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .listing-name { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 16px; }
  .listing-desc { font-size: 13px; color: #5A7189; }
  .listing-sub { font-size: 12.5px; color: #5A7189; margin-top: 2px; }
 
  .badge { font-size: 11px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; padding: 4px 9px; border-radius: 20px; white-space: nowrap; background: #E8F4EE; color: #14532D; }
 
  .claim-row { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .claim-row input {
    width: 70px; padding: 8px 10px; border: 1.5px solid #DDE5F0; border-radius: 7px; font-size: 13.5px;
    font-family: inherit; color: var(--navy); outline: none;
  }
  .claim-row input:focus { border-color: var(--blue); }
 
  .claim-btn {
    background: var(--blue); color: var(--white); border: none; padding: 8px 16px; border-radius: 7px;
    font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .claim-btn:hover { filter: brightness(1.08); }
  .claim-btn:disabled { opacity: 0.6; cursor: not-allowed; }
 
  .empty-state {
    background: var(--white); border: 1.5px dashed #DDE5F0; border-radius: 14px;
    padding: 48px 24px; text-align: center; color: var(--slate); font-size: 14px;
  }
</style>
</head>
<body>
 
<div class="topbar">
  <div class="brand-mark">RePlate<span>.</span></div>
  <div class="topbar-right">
    <div class="nav-links">
      <a class="nav-link" href="/listings-view">Food Listings</a>
      <a class="nav-link" href="/marketplace">Marketplace</a>
      <a class="nav-link" href="/pickup-slots-view">Pickup Slots</a>
      <a class="nav-link" href="/recommendations-view">Recommendations</a>
    </div>
    <button
      id="userLabel"
      class="topbar-user"
      type="button"
      onclick="window.location.href = '/dashboard'"
    >
      Welcome
    </button>
    <button class="logout-btn" onclick="handleLogout()">Log out</button>
  </div>
</div>
 
<div class="page">
  <div class="page-header">
    <h1>Available Donations</h1>
    <p>Claim surplus food for pickup and redistribution.</p>
  </div>
 
  <div class="error-msg" id="errorMsg"></div>
 
  <div id="donationsContainer">
    <div class="empty-state">Loading…</div>
  </div>
</div>
 
<script>
  function getToken() {
    return localStorage.getItem("session_token");
  }

  async function applyRoleNavAccess() {
    try {
      const token = getToken();
      if (!token) return;
      const res = await fetch("/auth/me", { headers: { "Authorization": token } });
      if (!res.ok) return;
      const user = await res.json();
      const allowed = {
        restaurant: ["/listings-view", "/marketplace", "/ngo-donations-view", "/pickup-slots-view", "/recommendations-view"],
        ngo: ["/marketplace", "/ngo-donations-view", "/pickup-slots-view", "/recommendations-view"],
        consumer: ["/consumer-search", "/consumer-history", "/pickup-slots-view", "/recommendations-view"],
      };
      const links = document.querySelectorAll(".nav-link");
      links.forEach((link) => {
        const href = link.getAttribute("href");
        if (!href || !allowed[user.role] || allowed[user.role].includes(href)) {
          link.style.display = "inline-block";
          return;
        }
        link.style.display = "none";
      });
    } catch (err) {
      // ignore and keep default nav visible
    }
  }
 
  async function guardPage() {
    const token = getToken();
    if (!token) { window.location.href = "/"; return; }
    try {
      const res = await fetch("/auth/me", { headers: { "Authorization": token } });
      if (!res.ok) { window.location.href = "/"; return; }
      const user = await res.json();
      window.currentUserRole = user.role;
      if (!['ngo', 'restaurant'].includes(user.role)) { window.location.href = "/"; return; }
      const displayName = user.name || user.email || "User";
      document.getElementById("userLabel").textContent = `Welcome, ${displayName}`;
      if (user.role !== "ngo") {
        showError("You are viewing donation listings in read-only mode. Only verified NGOs can claim them.");
      }
      loadDonations();
    } catch (err) {
      window.location.href = "/";
    }
  }
 
  async function handleLogout() {
    const token = getToken();
    if (token) {
      try { await fetch("/auth/logout", { method: "POST", headers: { "Authorization": token } }); } catch (err) {}
    }
    localStorage.removeItem("session_token");
    window.location.href = "/";
  }
 
  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
  }
 
  function showError(msg) {
    const el = document.getElementById("errorMsg");
    el.textContent = msg;
    el.classList.add("visible");
  }
 
  function hideError() {
    document.getElementById("errorMsg").classList.remove("visible");
  }
 
  // --- NGO Food Claiming ---
  async function loadDonations() {
    const container = document.getElementById("donationsContainer");
    try {
      const res = await fetch("/api/lifecycle/ngo/donations", { headers: { "Authorization": getToken() } });
      if (!res.ok) { container.innerHTML = '<div class="empty-state">Could not load donations.</div>'; return; }
      const donations = await res.json();
 
      if (donations.length === 0) {
        container.innerHTML = '<div class="empty-state">No donation listings right now — check back soon.</div>';
        return;
      }
 
      container.innerHTML = donations.map(renderCard).join("");
    } catch (err) {
      container.innerHTML = '<div class="empty-state">Could not reach the server.</div>';
    }
  }
 
  function renderCard(listing) {
    const listingId = listing.id || listing._id;
    const isNgo = window.currentUserRole === "ngo";
    return `
      <div class="listing-card">
        <div class="listing-card-top">
          <div>
            <div class="listing-name">${escapeHtml(listing.food_name)}</div>
            <div class="listing-desc">${escapeHtml(listing.description)}</div>
            <div class="listing-sub">${escapeHtml(listing.pickup_location)}</div>
          </div>
          <span class="badge">${listing.available_quantity} ${escapeHtml(listing.unit)} left</span>
        </div>
        <div class="claim-row">
          <input type="number" min="1" max="${listing.available_quantity}" value="1" id="qty-${listingId}" ${isNgo ? "" : "disabled"} />
          <button class="claim-btn" id="claim-btn-${listingId}" onclick="handleClaim('${listingId}')" ${isNgo ? "" : "disabled"}>
            ${isNgo ? "Claim for donation" : "NGO access only"}
          </button>
        </div>
      </div>
    `;
  }

  async function handleClaim(listingId) {
    hideError();
    const btn = document.getElementById(`claim-btn-${listingId}`);
    const qtyInput = document.getElementById(`qty-${listingId}`);
    if (!btn || !qtyInput) return;
    if (window.currentUserRole !== "ngo") {
      showError("Only verified NGOs can claim donations.");
      return;
    }

    const quantity = parseInt(qtyInput.value, 10) || 1;

    btn.disabled = true;
    btn.textContent = "Claiming…";
 
    try {
      const res = await fetch(`/api/lifecycle/ngo/donations/${listingId}/claim?quantity=${quantity}`, {
        method: "POST",
        headers: { "Authorization": getToken() },
      });
      const data = await res.json().catch(() => ({}));
 
      if (!res.ok) {
        showError(data.detail || "Could not claim this donation.");
        btn.disabled = false;
        btn.textContent = "Claim for donation";
        return;
      }
 
      loadDonations(); // refresh so claimed/emptied listings drop off the list
    } catch (err) {
      showError("Could not reach the server.");
      btn.disabled = false;
      btn.textContent = "Claim for donation";
    }
  }
 
  applyRoleNavAccess();
  guardPage();
</script>
 
</body>
</html>
