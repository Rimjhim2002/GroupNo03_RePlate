<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RePlate — Notifications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F9FC;
    --navy: #0B2545;
    --blue: #1D4ED8;
    --slate: #8DA9C4;
    --white: #FFFFFF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--navy);
    min-height: 100vh;
  }

  .topbar {
    background: var(--navy);
    color: var(--white);
    padding: 18px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand-mark {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 20px;
  }
  .brand-mark span { color: var(--slate); }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .topbar-user {
    font-size: 13px;
    color: var(--slate);
  }

  .back-link, .logout-btn, .mark-all-btn {
    background: transparent;
    border: 1.5px solid rgba(255,255,255,0.25);
    color: var(--white);
    padding: 7px 16px;
    border-radius: 7px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.15s ease;
  }
  .back-link:hover, .logout-btn:hover, .mark-all-btn:hover {
    border-color: var(--white);
    background: rgba(255,255,255,0.08);
  }

  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 32px 80px;
  }

  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .page-header-left h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .unread-badge {
    background: var(--blue);
    color: var(--white);
    font-size: 13px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
  }

  .page-header p {
    color: #5A7189;
    font-size: 14px;
    margin-top: 4px;
  }

  .notif-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .empty-state {
    background: var(--white);
    border: 1.5px dashed #DDE5F0;
    border-radius: 14px;
    padding: 56px 24px;
    text-align: center;
    color: var(--slate);
    font-size: 14px;
  }

  .notif-card {
    background: var(--white);
    border: 1px solid #E4E9F2;
    border-radius: 12px;
    padding: 16px 18px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    cursor: pointer;
    transition: border-color 0.15s ease;
    position: relative;
  }

  .notif-card:hover { border-color: var(--slate); }

  .notif-card.unread {
    border-left: 3px solid var(--blue);
    background: #F5F8FF;
  }

  .notif-icon {
    font-size: 20px;
    line-height: 1;
    margin-top: 2px;
    flex-shrink: 0;
  }

  .notif-body { flex: 1; min-width: 0; }

  .notif-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }

  .notif-title {
    font-weight: 600;
    font-size: 14.5px;
    color: var(--navy);
  }

  .notif-time {
    font-size: 11.5px;
    color: var(--slate);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .notif-message {
    font-size: 13px;
    color: #5A7189;
    margin-top: 3px;
    line-height: 1.45;
  }

  .notif-type-tag {
    display: inline-block;
    margin-top: 8px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 20px;
    background: #EEF2F8;
    color: var(--slate);
  }

  .unread-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--blue);
    flex-shrink: 0;
    margin-top: 6px;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand-mark">RePlate<span>.</span></div>
  <div class="topbar-right">
    <span class="topbar-user" id="userLabel"></span>
    <a class="back-link" href="/">Dashboard</a>
    <button class="logout-btn" onclick="handleLogout()">Log out</button>
  </div>
</div>

<div class="page">
  <div class="page-header">
    <div class="page-header-left">
      <h1>Notifications <span class="unread-badge" id="unreadBadge" style="display:none;">0</span></h1>
      <p>Alerts about food nearby, reservations, and updates.</p>
    </div>
    <button class="mark-all-btn" id="markAllBtn" onclick="markAllRead()" style="display:none;">Mark all read</button>
  </div>

  <div class="notif-list" id="notifList">
    <div class="empty-state">Loading notifications...</div>
  </div>
</div>

<script>
  const TYPE_ICONS = {
    new_listing_nearby: "🍞",
    donation_available: "🤝",
    waitlist_next: "⏰",
    rating_received: "⭐",
    expiry_alert: "⚠️",
  };

  const TYPE_LABELS = {
    new_listing_nearby: "New Listing",
    donation_available: "Donation Available",
    waitlist_next: "Waitlist",
    rating_received: "Rating",
    expiry_alert: "Expiry Alert",
  };

  function getToken() {
    return localStorage.getItem("session_token");
  }

  let allNotifications = [];

  async function guardPage() {
    const token = getToken();
    if (!token) {
      window.location.href = "/";
      return;
    }
    try {
      const res = await fetch("/auth/me", { headers: { "Authorization": token } });
      if (!res.ok) {
        window.location.href = "/";
        return;
      }
      const user = await res.json();
      document.getElementById("userLabel").textContent = user.name;
      loadNotifications();
    } catch (err) {
      window.location.href = "/";
    }
  }

  async function handleLogout() {
    const token = getToken();
    if (token) {
      try {
        await fetch("/auth/logout", { method: "POST", headers: { "Authorization": token } });
      } catch (err) {}
    }
    localStorage.removeItem("session_token");
    window.location.href = "/";
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function timeAgo(dateStr) {
    if (!dateStr) return "";
    const diffMs = Date.now() - new Date(dateStr).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + "m ago";
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + "h ago";
    const days = Math.floor(hrs / 24);
    return days + "d ago";
  }

  function render() {
    const list = document.getElementById("notifList");
    const unreadCount = allNotifications.filter(n => !n.is_read).length;

    const badge = document.getElementById("unreadBadge");
    const markAllBtn = document.getElementById("markAllBtn");
    if (unreadCount > 0) {
      badge.textContent = unreadCount;
      badge.style.display = "inline-block";
      markAllBtn.style.display = "inline-block";
    } else {
      badge.style.display = "none";
      markAllBtn.style.display = "none";
    }

    if (allNotifications.length === 0) {
      list.innerHTML = '<div class="empty-state">No notifications yet. You\'ll see alerts here about nearby food, reservations, and more.</div>';
      return;
    }

    list.innerHTML = allNotifications.map(n => {
      const icon = TYPE_ICONS[n.type] || "🔔";
      const typeLabel = TYPE_LABELS[n.type] || n.type;
      const unreadClass = n.is_read ? "" : "unread";
      const dot = n.is_read ? "" : '<div class="unread-dot"></div>';

      return `
        <div class="notif-card ${unreadClass}" onclick="handleNotifClick('${n.id}', ${n.is_read})">
          <div class="notif-icon">${icon}</div>
          <div class="notif-body">
            <div class="notif-top">
              <div class="notif-title">${escapeHtml(n.title)}</div>
              <div class="notif-time">${timeAgo(n.sent_at || n.created_at)}</div>
            </div>
            <div class="notif-message">${escapeHtml(n.message)}</div>
            <div class="notif-type-tag">${typeLabel}</div>
          </div>
          ${dot}
        </div>
      `;
    }).join("");
  }

  async function loadNotifications() {
    try {
      const res = await fetch("/notifications/mine", { headers: { "Authorization": getToken() } });
      if (!res.ok) return;
      allNotifications = await res.json();
      render();
    } catch (err) {
      document.getElementById("notifList").innerHTML =
        '<div class="empty-state">Could not load notifications.</div>';
    }
  }

  async function handleNotifClick(id, isRead) {
    if (isRead) return;
    try {
      await fetch(`/notifications/${id}/read`, {
        method: "POST",
        headers: { "Authorization": getToken() },
      });
      const n = allNotifications.find(x => x.id === id);
      if (n) n.is_read = true;
      render();
    } catch (err) {}
  }

  async function markAllRead() {
    const unread = allNotifications.filter(n => !n.is_read);
    for (const n of unread) {
      try {
        await fetch(`/notifications/${n.id}/read`, {
          method: "POST",
          headers: { "Authorization": getToken() },
        });
        n.is_read = true;
      } catch (err) {}
    }
    render();
  }

  guardPage();

  // refresh every 20s so new alerts show up without a manual reload
  setInterval(loadNotifications, 20000);
</script>

</body>
</html>
