<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RePlate - My History</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F7F9FC;
      --navy: #0B2545;
      --blue: #1D4ED8;
      --slate: #8DA9C4;
      --green: #166534;
      --white: #FFFFFF;
      --muted: #61738a;
      --card: #ffffff;
      --border: #dfeaf3;
      --shadow: 0 14px 32px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', Arial, sans-serif; background: var(--bg); color: var(--navy); }
    .topbar {
      background: var(--navy); color: var(--white); padding: 18px 40px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px;
    }
    .brand-mark { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 20px; }
    .brand-mark span { color: var(--slate); }
    .topbar-right {
      display: flex; align-items: center; gap: 16px; flex-wrap: nowrap;
    }
    .nav-links {
      display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;
      white-space: nowrap;
    }
    .nav-link, .logout-btn {
      background: transparent; border: 1.5px solid rgba(255,255,255,0.25); color: var(--white);
      padding: 7px 16px; border-radius: 7px; font-family: inherit; font-size: 13px; font-weight: 600;
      cursor: pointer; text-decoration: none; transition: all 0.15s ease; display: inline-block; line-height: 1.2;
      white-space: nowrap;
    }
    .nav-link:hover, .logout-btn:hover { border-color: var(--white); background: rgba(255,255,255,0.08); }
    .topbar-user {
      font-size: 12px; color: var(--slate); background: transparent; border: none; padding: 0;
      font-weight: 600; cursor: pointer; line-height: 1.2;
    }
    .page { max-width: 1100px; margin: 28px auto; padding: 0 18px 60px; }
    .page-header { margin-bottom: 22px; }
    .page-header h1 {
      margin: 0 0 8px; font-family: 'Space Grotesk', sans-serif; font-size: 28px; letter-spacing: -0.01em;
    }
    .page-header p { color: #5A7189; font-size: 14px; margin: 0; }
    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 22px;
    }
    .stat {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; box-shadow: var(--shadow);
    }
    .stat-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
    .stat-value { font-size: 26px; font-weight: 700; margin-top: 8px; color: var(--navy); }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 18px;
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 10px; border-bottom: 1px solid var(--border); text-align: left; }
    th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
    .badge {
      display: inline-block; padding: 6px 10px; border-radius: 999px; background: #eaf7ee; color: var(--green); font-size: 11px; font-weight: 700;
    }
    .empty { color: var(--muted); padding: 18px 0; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand-mark">RePlate<span>.</span></div>
    <div class="topbar-right">
      <div class="nav-links">
        <a class="nav-link" href="/consumer-search">Nearby Food</a>
        <a class="nav-link" href="/consumer-history">Transaction History</a>
        <a class="nav-link" href="/pickup-slots-view">Pickup Slots</a>
        <a class="nav-link" href="/recommendations-view">Recommendations</a>
      </div>
      <button id="userLabel" class="topbar-user" type="button" onclick="window.location.href='/'">Welcome, User</button>
      <button class="logout-btn" onclick="handleLogout()">Log out</button>
    </div>
  </header>

  <main class="page">
    <div class="page-header">
      <div>
        <h1>Transaction History</h1>
        <p>Track your reservations, purchases, and completed food pickups.</p>
      </div>
    </div>

    <section id="stats" class="stats"></section>

    <section class="card">
      <table>
        <thead>
          <tr>
            <th>Food</th>
            <th>Restaurant</th>
            <th>Type</th>
            <th>Qty</th>
            <th>Total</th>
            <th>Status</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="historyTable"></tbody>
      </table>
    </section>
  </main>

  <script>
    const token = () => localStorage.getItem('session_token');

    async function applyRoleNavAccess() {
      try {
        const authToken = token();
        if (!authToken) return;
        const res = await fetch('/auth/me', { headers: { 'Authorization': authToken } });
        if (!res.ok) return;
        const user = await res.json();
        const displayName = user.business_name || user.organization_name || user.name || 'User';
        const userLabel = document.getElementById('userLabel');
        if (userLabel) userLabel.textContent = `Welcome, ${displayName}`;

        const allowed = {
          restaurant: ['/listings-view', '/pickup-slots-view', '/recommendations-view'],
          ngo: ['/ngo-donations-view', '/pickup-slots-view', '/recommendations-view'],
          consumer: ['/consumer-search', '/consumer-history', '/pickup-slots-view', '/recommendations-view'],
        };
        document.querySelectorAll('.nav-link').forEach((link) => {
          const href = link.getAttribute('href');
          if (!href || !allowed[user.role] || allowed[user.role].includes(href)) {
            link.style.display = 'inline-block';
            return;
          }
          link.style.display = 'none';
        });
      } catch (err) {
        // ignore and keep default nav visible
      }
    }

    function renderStats(summary) {
      const stats = [
        { label: 'Total spend', value: '$' + Number(summary.total_spend || 0).toFixed(2) },
        { label: 'Active reservations', value: summary.active_reservations || 0 },
        { label: 'Completed orders', value: summary.completed_orders || 0 },
        { label: 'Meals received', value: summary.meals_received || 0 }
      ];

      const container = document.getElementById('stats');
      container.innerHTML = stats.map(stat => `
        <div class="stat">
          <div class="stat-label">${stat.label}</div>
          <div class="stat-value">${stat.value}</div>
        </div>
      `).join('');
    }

    function renderRows(transactions) {
      const tbody = document.getElementById('historyTable');
      if (!transactions.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty">No transaction history yet.</td></tr>';
        return;
      }

      tbody.innerHTML = transactions.map(tx => `
        <tr>
          <td>${tx.food_name || 'Food item'}</td>
          <td>${tx.restaurant_name || 'Restaurant'}</td>
          <td>${tx.type || 'sale'}</td>
          <td>${tx.quantity}</td>
          <td>$${Number(tx.total_amount || 0).toFixed(2)}</td>
          <td><span class="badge">${tx.status}</span></td>
          <td>${new Date(tx.reserved_at).toLocaleString()}</td>
        </tr>
      `).join('');
    }

    async function loadHistory() {
      const res = await fetch('/consumer/history', {
        headers: { 'Authorization': token() }
      });

      if (!res.ok) {
        document.getElementById('historyTable').innerHTML = '<tr><td colspan="7" class="empty">Please log in as a consumer to view your history.</td></tr>';
        return;
      }

      const data = await res.json();
      renderStats(data.summary || {});
      renderRows(data.transactions || []);
    }

    async function handleLogout() {
      const tokenValue = token();
      if (tokenValue) {
        await fetch('/auth/logout', { method: 'POST', headers: { 'Authorization': tokenValue } });
      }
      localStorage.removeItem('session_token');
      window.location.href = '/';
    }

    applyRoleNavAccess();
    loadHistory();
  </script>
</body>
</html>
