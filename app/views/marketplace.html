<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RePlate - Marketplace</title>
  <style>
    :root { --bg: #f7f9fc; --navy: #0b2545; --slate: #8da9c4; --white: #ffffff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--navy); font-family: Inter, Arial, sans-serif; }
    .topbar { background: var(--navy); color: var(--white); padding: 18px 40px; display: flex; align-items: center; justify-content: space-between; }
    .brand { font-size: 20px; font-weight: 700; }
    .brand span { color: var(--slate); }
    .account-link { color: var(--white); text-decoration: none; }
    .topbar-right, .header-links { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .nav-btn { background: transparent; border: 1px solid rgba(255,255,255,.3); color: var(--white); padding: 8px 14px; border-radius: 7px; text-decoration: none; font-size: 13px; font-weight: 600; cursor: pointer; }
    .page { max-width: 1100px; margin: 0 auto; padding: 42px 24px 80px; }
    .page-header { margin-bottom: 24px; }
    h1 { margin: 0; font-size: 30px; }
    .subtitle { margin-top: 7px; color: #5a7189; }
    .message { display: none; margin-bottom: 18px; padding: 12px 14px; border-radius: 9px; font-size: 14px; font-weight: 600; }
    .message.visible { display: block; }
    .message.success { background: #e8f4ee; color: #14532d; border: 1px solid #b7dfc4; }
    .message.error { background: #fdecec; color: #b42318; border: 1px solid #f5c2c0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
    .card { background: var(--white); border: 1px solid #e4e9f2; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .card-top, .status-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .food-name { margin: 0; font-size: 19px; }
    .description, .meta { color: #5a7189; font-size: 13px; line-height: 1.5; }
    .badge { background: #e8f4ee; color: #14532d; border-radius: 999px; padding: 5px 9px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .badge.expired { background: #fdecec; color: #b42318; }
    .price { color: #1d4ed8; font-size: 22px; font-weight: 800; }
    .old-price { color: #7a90a6; text-decoration: line-through; font-size: 12px; }
    .actions { display: flex; gap: 8px; }
    .actions input { width: 68px; border: 1px solid #d8e1ed; border-radius: 7px; padding: 9px; }
    .reserve-btn { flex: 1; border: 0; border-radius: 7px; padding: 9px 12px; background: #1d4ed8; color: var(--white); font-weight: 700; cursor: pointer; }
    .reserve-btn:disabled { opacity: .6; cursor: not-allowed; }
    .empty-state { background: var(--white); border: 1px dashed #d8e1ed; border-radius: 14px; padding: 56px 24px; text-align: center; color: #5a7189; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">RePlate<span>.</span></div>
    <div class="topbar-right">
      <nav class="header-links">
        <a class="nav-btn" id="listingsLink" href="/listings-view">Listings</a>
        <a class="nav-btn" id="ngoDonationsLink" href="/ngo-donations-view">NGO Donations</a>
        <a class="nav-btn" id="recommendationsLink" href="/recommendations-view">Recommendations</a>
      </nav>
      <a id="userNameLabel" class="account-link" href="/" title="Open account dashboard">Loading...</a>
      <button class="nav-btn" onclick="logout()">Log out</button>
    </div>
  </header>

  <main class="page">
    <section class="page-header">
      <h1>Available surplus food</h1>
      <p class="subtitle">Choose a listing and reserve what you need.</p>
    </section>
    <div id="message" class="message"></div>
    <section id="listings" class="grid">
      <div class="empty-state">Loading food listings...</div>
    </section>
  </main>

  <script>
    function getToken() {
      return localStorage.getItem("session_token");
    }

    function escapeHtml(value) {
      const element = document.createElement("div");
      element.textContent = value ?? "";
      return element.innerHTML;
    }

    function showMessage(text, type) {
      const message = document.getElementById("message");
      message.textContent = text;
      message.className = `message visible ${type}`;
    }

    function parseExpiryDate(expiryDate) {
      const value = String(expiryDate || "");
      const hasTimezone = value.endsWith("Z") || /[+-]\d{2}:?\d{2}$/.test(value);
      return Date.parse(hasTimezone ? value : `${value}Z`);
    }

    function formatRemainingTime(expiryDate) {
      const remainingMinutes = Math.max(0, Math.ceil((parseExpiryDate(expiryDate) - Date.now()) / 60000));
      if (remainingMinutes < 1) return "less than 1m left";
      if (remainingMinutes < 60) return `${remainingMinutes}m left`;
      const hours = Math.floor(remainingMinutes / 60);
      const minutes = remainingMinutes % 60;
      return minutes ? `${hours}h ${minutes}m left` : `${hours}h left`;
    }

    function renderListings(listings) {
      const container = document.getElementById("listings");
      const activeListings = listings.filter(listing => {
        return listing.available_quantity > 0;
      });
      if (!activeListings.length) {
        container.innerHTML = '<div class="empty-state">No approved food listings are available yet.</div>';
        return;
      }
      container.innerHTML = activeListings.map(listing => {
        const price = listing.discounted_price ?? listing.original_price;
        const oldPrice = listing.discount_percentage > 0
          ? `<span class="old-price">$${listing.original_price.toFixed(2)}</span>`
          : "";
        const timeLeft = formatRemainingTime(listing.expiry_date);
        return `
          <article class="card">
            <div class="card-top">
              <div>
                <h2 class="food-name">${escapeHtml(listing.food_name)}</h2>
                <p class="description">${escapeHtml(listing.description)}</p>
              </div>
              <span class="badge">${timeLeft}</span>
            </div>
            <div class="meta">${listing.available_quantity} available · Pickup: ${escapeHtml(listing.pickup_location)}</div>
            <div class="status-row"><div>${oldPrice}<div class="price">$${price.toFixed(2)}</div></div></div>
            <div class="actions">
              <input id="qty-${listing.id}" type="number" min="1" max="${listing.available_quantity}" value="1" />
              <button class="reserve-btn" onclick="reserveListing('${listing.id}')">Reserve food</button>
            </div>
          </article>
        `;
      }).join("");
    }

    async function loadListings() {
      try {
        const response = await fetch("/listings/available");
        const listings = await response.json();
        if (!response.ok) throw new Error(listings.detail || "Could not load food listings.");
        renderListings(listings);
      } catch (error) {
        document.getElementById("listings").innerHTML = '<div class="empty-state">Could not load food listings.</div>';
        showMessage(error.message, "error");
      }
    }

    async function reserveListing(listingId) {
      const quantityInput = document.getElementById(`qty-${listingId}`);
      const quantity = parseInt(quantityInput.value, 10);
      if (!getToken()) {
        showMessage("Please log in as a consumer to reserve food.", "error");
        return;
      }
      if (!quantity || quantity < 1) {
        showMessage("Enter a valid quantity.", "error");
        return;
      }
      try {
        const response = await fetch(`/api/consumer/reserve/${listingId}?quantity=${quantity}`, {
          method: "POST",
          headers: { "Authorization": getToken() },
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || "Could not reserve this food.");
        showMessage(result.message || "Food reserved successfully.", "success");
        await loadListings();
      } catch (error) {
        showMessage(error.message, "error");
      }
    }

    async function loadUserName() {
      const token = getToken();
      const label = document.getElementById("userNameLabel");
      if (!token) {
        label.textContent = "Guest";
        return;
      }
      try {
        const response = await fetch("/auth/me", { headers: { "Authorization": token } });
        if (!response.ok) {
          label.textContent = "Guest";
          return;
        }
        const user = await response.json();
        if (user.role !== "restaurant") {
          document.getElementById("recommendationsLink").remove();
        }
        if (user.role !== "restaurant") {
          document.getElementById("listingsLink").remove();
        }
        if (user.role === "consumer") {
          document.getElementById("ngoDonationsLink").remove();
        }
        label.textContent = `Welcome, ${user.business_name || user.organization_name || user.name || "User"}`;
      } catch (error) {
        label.textContent = "Guest";
      }
    }

    async function logout() {
      const token = getToken();
      if (token) {
        try { await fetch("/auth/logout", { method: "POST", headers: { "Authorization": token } }); } catch (error) {}
      }
      localStorage.removeItem("session_token");
      window.location.href = "/";
    }

    loadUserName();
    loadListings();
    setInterval(loadListings, 30000);
  </script>
</body>
</html>
