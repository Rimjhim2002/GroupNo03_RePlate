<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RePlate - Marketplace</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #F7F9FC;
      --navy: #0B2545;
      --blue: #1D4ED8;
      --slate: #8DA9C4;
      --white: #FFFFFF;
      --border: #DDE5F0;
      --green: #14532D;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--navy);
      font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
    }

    .topbar {
      background: var(--navy);
      color: var(--white);
      padding: 18px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-family: "Space Grotesk", sans-serif;
      font-size: 20px;
      font-weight: 600;
    }

    .brand span {
      color: var(--slate);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-links {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .user {
      color: var(--white);
      font-size: 13px;
      font-weight: 600;
      background: transparent;
      border: 1.5px solid rgba(255,255,255,0.25);
      padding: 7px 16px;
      border-radius: 7px;
      font-family: inherit;
      cursor: pointer;
      line-height: 1.2;
      white-space: nowrap;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .nav-btn {
      background: transparent;
      color: white;
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 7px;
      padding: 7px 14px;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
      font-size: 13px;
      line-height: 1.2;
    }

    .nav-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .page {
      max-width: 1000px;
      margin: auto;
      padding: 40px 32px 80px;
    }

    .page-header {
      margin-bottom: 28px;
    }

    h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: 28px;
      margin: 0 0 6px;
    }

    .subtitle {
      color: #5A7189;
      margin: 0;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #E8F4EE;
      color: var(--green);
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .food-name {
      font-family: "Space Grotesk", sans-serif;
      font-size: 18px;
      font-weight: 600;
      margin: 0;
    }

    .description {
      color: #5A7189;
      font-size: 13px;
      line-height: 1.5;
      margin: 0;
    }

    .location {
      color: #5A7189;
      font-size: 13px;
    }

    .badge {
      display: inline-block;
      white-space: nowrap;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 9px;
      border-radius: 20px;
      background: #E8F4EE;
      color: var(--green);
      height: fit-content;
    }

    .stock-badge {
      background: #E6EEFB;
      color: var(--blue);
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 4px;
    }

    .old-price {
      color: var(--slate);
      text-decoration: line-through;
      font-size: 13px;
    }

    .price {
      font-size: 22px;
      font-weight: 700;
      color: var(--blue);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 5px;
    }

    input {
      width: 65px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font: inherit;
    }

    .reserve-btn {
      flex: 1;
      padding: 10px 12px;
      border: 0;
      border-radius: 7px;
      background: var(--blue);
      color: white;
      cursor: pointer;
      font-weight: 600;
      font: inherit;
    }

    .reserve-btn:hover {
      opacity: .9;
    }

    .pickup-btn {
      width: 100%;
      margin-top: 4px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: white;
      color: var(--blue);
      cursor: pointer;
      font-weight: 600;
    }

    .pickup {
      display: none;
      padding: 10px;
      margin-top: 2px;
      background: #F7F9FC;
      border-radius: 7px;
      color: #5A7189;
      font-size: 12.5px;
      line-height: 1.7;
    }

    .pickup.visible {
      display: block;
    }

    @media (max-width: 600px) {
      .topbar {
        padding: 16px 20px;
      }

      .page {
        padding: 30px 18px 60px;
      }
    }
  </style>
</head>

<body>

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="brand">RePlate<span>.</span></div>

    <div class="topbar-right">
      <div class="header-links">
        <a class="nav-btn" href="/listings-view">Food Listings</a>
        <a class="nav-btn" href="/consumer-search">Nearby Food</a>
        <a class="nav-btn" href="/ngo-donations-view" style="display:none">NGO Donations</a>
        <a class="nav-btn" href="/pickup-slots-view">Pickup Slots</a>
        <a class="nav-btn" href="/recommendations-view">Recommendations</a>
      </div>

      <button
        id="userNameLabel"
        class="user"
        type="button"
        onclick="window.location.href = '/dashboard'"
      >
        Loading...
      </button>

      <button class="nav-btn" onclick="logout()">
        Log out
      </button>
    </div>
  </header>


  <!-- MAIN MARKETPLACE -->
  <main class="page">

    <section class="page-header">
      <h1>Available surplus food</h1>

      <p class="subtitle">
        Choose a listing and reserve what you need.
      </p>
    </section>


    <!-- SUCCESS MESSAGE -->
    <div id="message" class="message"></div>


    <!-- FOOD LISTINGS -->
    <section id="listingsGrid" class="grid"></section>

  </main>



  <!-- JAVASCRIPT -->
  <script>

    function getToken() {
      return localStorage.getItem("session_token");
    }

    async function applyRoleNavAccess() {
      try {
        const token = getToken();
        if (!token) return;
        const res = await fetch("/auth/me", { headers: { "Authorization": token } });
        if (!res.ok) return;
        const user = await res.json();
        window.currentUserRole = user.role;
        const allowed = {
          restaurant: ["/listings-view", "/marketplace", "/ngo-donations-view", "/pickup-slots-view", "/recommendations-view"],
          ngo: ["/ngo-donations-view", "/pickup-slots-view", "/recommendations-view"],
          consumer: ["/consumer-search", "/consumer-history", "/pickup-slots-view", "/recommendations-view"],
          administrator: ["/marketplace"],
        };
        const links = document.querySelectorAll(".nav-btn");
        links.forEach((link) => {
          const href = link.getAttribute("href");
          if (!href || (allowed[user.role] && allowed[user.role].includes(href))) {
            link.style.display = "inline-block";
            return;
          }
          link.style.display = "none";
        });
      } catch (err) {
        // ignore and keep default nav visible
      }
    }

    function showMessage(text, isError = false) {
      const element = document.getElementById("message");
      element.style.display = "block";
      element.style.background = isError ? "#fee2e2" : "#edfdf3";
      element.style.color = isError ? "#991b1b" : "#166534";
      element.textContent = text;
    }

    function renderListing(listing) {
      const card = document.createElement("article");
      card.className = "card";

      const remainingHours = Number(listing.remaining_hours || 0);
      const badge = remainingHours > 24 ? "Fresh" : remainingHours > 6 ? "Limited" : "Urgent";
      const price = Number(listing.discounted_price || 0).toFixed(2);
      const original = Number(listing.original_price || 0).toFixed(2);
      const isConsumer = window.currentUserRole === "consumer";

      card.innerHTML = `
        <div class="card-top">
          <div>
            <h2 class="food-name">${listing.food_name}</h2>
            <p class="description">${listing.description || "Freshly prepared food available for pickup."}</p>
          </div>
          <span class="badge">${badge}</span>
        </div>

        <div class="location">${listing.available_quantity} ${listing.unit || "items"} · ${listing.pickup_location || listing.restaurant_name || "Pickup location"}</div>

        <div class="price-row">
          <span class="old-price">$${original}</span>
          <span class="price">$${price}</span>
        </div>

        <span class="badge stock-badge">${listing.available_quantity} left</span>

        ${isConsumer ? `
          <div class="actions">
            <input id="qty-${listing.id}" type="number" min="1" max="${listing.available_quantity}" value="1" />
            <button class="reserve-btn" onclick="reserveListing('${listing.id}')">Reserve food</button>
          </div>
        ` : '<p class="description">Available sale listing. Consumers can reserve this food.</p>'}

        <button class="pickup-btn" onclick="togglePickup('pickup-${listing.id}')">View pickup times</button>

        <div id="pickup-${listing.id}" class="pickup">
          ${listing.pickup_location || "Pickup location available on request"}
        </div>
      `;

      return card;
    }

    async function loadListings() {
      const grid = document.getElementById("listingsGrid");
      const token = getToken();

      if (!token) {
        grid.innerHTML = '<article class="card"><div class="card-top"><div><h2 class="food-name">No listings available</h2><p class="description">Please log in to view real marketplace listings.</p></div></div></article>';
        showMessage("Please log in to view marketplace listings.", true);
        return;
      }

      try {
        const response = await fetch("/consumer/search", {
          headers: { "Authorization": token }
        });

        if (!response.ok) {
          throw new Error("Unable to load marketplace listings.");
        }

        const listings = await response.json();
        grid.innerHTML = "";

        if (!listings.length) {
          grid.innerHTML = '<article class="card"><div class="card-top"><div><h2 class="food-name">No real listings yet</h2><p class="description">New food listings will appear here as they are added.</p></div></div></article>';
          return;
        }

        listings.forEach((listing) => grid.appendChild(renderListing(listing)));
      } catch (error) {
        grid.innerHTML = '<article class="card"><div class="card-top"><div><h2 class="food-name">Marketplace unavailable</h2><p class="description">Unable to load the current listings right now.</p></div></div></article>';
        showMessage("Unable to load marketplace listings.", true);
      }
    }

    applyRoleNavAccess().then(() => loadListings());

    async function reserveListing(listingId) {
      const token = getToken();
      const quantity = Number(document.getElementById("qty-" + listingId)?.value || 1);

      if (!token) {
        showMessage("Please log in before reserving food.", true);
        return;
      }

      try {
        const response = await fetch(`/consumer/listings/${listingId}/reserve?quantity=${quantity}`, {
          method: "POST",
          headers: { "Authorization": token }
        });

        const body = await response.json();

        if (!response.ok) {
          throw new Error(body.detail || "Reservation failed");
        }

        showMessage(`${body.message || "Reservation created."} Total: $${Number(body.total_amount || 0).toFixed(2)}`);
        await loadListings();
      } catch (error) {
        showMessage(error.message || "Reservation failed.", true);
      }
    }

    function togglePickup(id) {
      const panel = document.getElementById(id);
      if (panel) {
        panel.classList.toggle("visible");
      }
    }

    async function loadUserName() {
      const token = getToken();
      const label = document.getElementById("userNameLabel");

      if (!token) {
        label.textContent = "Guest";
        return;
      }

      try {
        const res = await fetch("/auth/me", {
          headers: { "Authorization": token }
        });

        if (!res.ok) {
          label.textContent = "Guest";
          return;
        }

        const user = await res.json();
        const displayName = user.name || user.email || "User";
        label.textContent = `Welcome, ${displayName}`;
      } catch (err) {
        label.textContent = "Welcome";
      }
    }

    async function logout() {
      const token = getToken();
      if (token) {
        try {
          await fetch("/auth/logout", {
            method: "POST",
            headers: { "Authorization": token }
          });
        } catch (err) {}
      }
      localStorage.removeItem("session_token");
      window.location.href = "/";
    }

    loadUserName();

  </script>

</body>
</html>
