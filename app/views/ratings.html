<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RePlate — Ratings & Feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F9FC;
    --navy: #0B2545;
    --blue: #1D4ED8;
    --amber: #F59E0B;
    --green: #10B981;
    --slate: #8DA9C4;
    --white: #FFFFFF;
    --card-border: #E4E9F2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--navy);
    min-height: 100vh;
  }

  .topbar {
    background: var(--navy);
    color: var(--white);
    padding: 18px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand-mark {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 20px;
  }
  .brand-mark span { color: var(--slate); }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .topbar-user {
    font-size: 13px;
    color: var(--white);
    background: transparent;
    border: 1.5px solid rgba(255,255,255,0.25);
    padding: 7px 16px;
    border-radius: 7px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    line-height: 1.2;
    white-space: nowrap;
    transition: all 0.15s ease;
  }

  .nav-btn, .logout-btn {
    background: transparent;
    border: 1.5px solid rgba(255,255,255,0.25);
    color: var(--white);
    padding: 7px 16px;
    border-radius: 7px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.15s ease;
  }
  .nav-btn:hover, .logout-btn:hover {
    border-color: var(--white);
    background: rgba(255,255,255,0.08);
  }

  .page {
    max-width: 900px;
    margin: 0 auto;
    padding: 36px 32px 80px;
  }

  .page-header {
    margin-bottom: 28px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
  }

  .page-header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .page-header p {
    color: #5A7189;
    font-size: 14.5px;
    margin-top: 6px;
  }

  .submit-trigger-btn {
    background: var(--blue);
    color: var(--white);
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
    transition: filter 0.15s ease;
  }
  .submit-trigger-btn:hover { filter: brightness(1.1); }

  /* Summary Card */
  .score-card {
    background: var(--white);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 28px 32px;
    display: flex;
    align-items: center;
    gap: 36px;
    margin-bottom: 28px;
    box-shadow: 0 2px 10px rgba(11,37,69,0.02);
  }

  @media (max-width: 600px) {
    .score-card { flex-direction: column; align-items: flex-start; gap: 20px; }
  }

  .score-big {
    text-align: center;
    min-width: 140px;
  }

  .score-number {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 48px;
    font-weight: 700;
    color: var(--navy);
    line-height: 1;
  }

  .score-stars {
    color: var(--amber);
    font-size: 20px;
    margin-top: 6px;
  }

  .score-count {
    font-size: 12px;
    color: #5A7189;
    margin-top: 4px;
  }

  .breakdown-bars {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
  }

  .bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12.5px;
  }

  .bar-label { min-width: 45px; color: #5A7189; }
  .bar-track {
    flex: 1;
    height: 8px;
    background: #EEF2F8;
    border-radius: 4px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--amber);
    border-radius: 4px;
  }
  .bar-val { min-width: 30px; text-align: right; color: #5A7189; font-weight: 600; }

  /* Reviews List */
  .reviews-section h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 16px;
  }

  .reviews-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .review-card {
    background: var(--white);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 18px 20px;
  }

  .review-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .review-author {
    font-weight: 700;
    font-size: 14px;
  }

  .review-stars {
    color: var(--amber);
    font-size: 14px;
  }

  .review-body {
    font-size: 13.5px;
    line-height: 1.5;
    color: #334155;
  }

  .review-date {
    font-size: 11.5px;
    color: #8DA9C4;
    margin-top: 8px;
  }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(11, 37, 69, 0.45);
    backdrop-filter: blur(2px);
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .modal-overlay.visible { display: flex; }

  .modal-card {
    background: var(--white);
    border-radius: 14px;
    max-width: 480px;
    width: 100%;
    padding: 28px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  }

  .modal-card h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px;
    margin-bottom: 6px;
  }

  .modal-card p {
    font-size: 13px;
    color: #5A7189;
    margin-bottom: 20px;
  }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; }
  .field input, .field textarea, .field select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #DDE5F0;
    border-radius: 8px;
    font-family: inherit;
    font-size: 13.5px;
  }

  .star-select {
    display: flex;
    gap: 8px;
    font-size: 26px;
    cursor: pointer;
  }
  .star-select span { color: #DDE5F0; transition: color 0.1s; }
  .star-select span.active { color: var(--amber); }

  .modal-btns {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
  }

  .modal-cancel {
    background: transparent;
    border: 1px solid #DDE5F0;
    padding: 8px 16px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: 600;
  }

  .modal-submit {
    background: var(--blue);
    color: var(--white);
    border: none;
    padding: 8px 18px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand-mark">RePlate<span>.</span></div>
  <div class="topbar-right">
    <button class="topbar-user" id="userLabel" type="button" onclick="window.location.href = '/dashboard'">Welcome</button>
    <a class="nav-btn" href="/notifications-view">🔔 Notifications</a>
    <button class="logout-btn" onclick="handleLogout()">Log out</button>
  </div>
</div>

<div class="page">
  <div class="page-header">
    <div>
      <h1>⭐ Ratings & Feedback</h1>
      <p>Maintain trust, service quality, and community reputation across RePlate.</p>
    </div>
    <button class="submit-trigger-btn" onclick="openRatingModal()">+ Leave Feedback</button>
  </div>

  <div class="score-card">
    <div class="score-big">
      <div class="score-number" id="avgStars">0.0</div>
      <div class="score-stars" id="starIcons">☆☆☆☆☆</div>
      <div class="score-count" id="totalReviewsCount">0 total reviews</div>
    </div>
    <div class="breakdown-bars" id="breakdownBars">
      <!-- Star Breakdown Bars -->
    </div>
  </div>

  <div class="reviews-section">
    <h2>Community Feedback & Reviews</h2>
    <div class="reviews-list" id="reviewsList">
      <div style="color: #8DA9C4; font-size: 14px;">Loading reviews...</div>
    </div>
  </div>
</div>

<!-- Modal to Submit Rating -->
<div class="modal-overlay" id="ratingModal">
  <div class="modal-card">
    <h3>Submit Feedback</h3>
    <p>Rate your experience for a completed order or donation pickup.</p>
    
    <div class="field">
      <label>Transaction ID</label>
      <input type="text" id="modalTxId" placeholder="Paste completed transaction ID" />
    </div>

    <div class="field">
      <label>Rating (1 to 5 Stars)</label>
      <div class="star-select" id="starPicker">
        <span onclick="setStars(1)">★</span>
        <span onclick="setStars(2)">★</span>
        <span onclick="setStars(3)">★</span>
        <span onclick="setStars(4)">★</span>
        <span onclick="setStars(5)">★</span>
      </div>
    </div>

    <div class="field">
      <label>Review & Feedback</label>
      <textarea id="modalReview" rows="3" placeholder="Food quality, pickup coordination, punctuality..."></textarea>
    </div>

    <div class="modal-btns">
      <button class="modal-cancel" type="button" onclick="closeRatingModal()">Cancel</button>
      <button class="modal-submit" type="button" onclick="submitFeedback()">Submit Review</button>
    </div>
  </div>
</div>

<script>
  let selectedStars = 5;
  let currentUser = null;

  function getToken() {
    return localStorage.getItem("session_token");
  }

  async function guardPage() {
    const token = getToken();
    if (!token) {
      window.location.href = "/";
      return;
    }
    try {
      const res = await fetch("/auth/me", { headers: { "Authorization": token } });
      if (!res.ok) { window.location.href = "/"; return; }
      currentUser = await res.json();
      const displayName = currentUser.name || currentUser.email || "User";
      document.getElementById("userLabel").textContent = `Welcome, ${displayName}`;
      loadUserRatings(currentUser.id);
      setStars(5);
    } catch (err) {
      window.location.href = "/";
    }
  }

  async function handleLogout() {
    const token = getToken();
    if (token) {
      try {
        await fetch("/auth/logout", { method: "POST", headers: { "Authorization": token } });
      } catch (err) {}
    }
    localStorage.removeItem("session_token");
    window.location.href = "/";
  }

  async function loadUserRatings(userId) {
    try {
      const res = await fetch(`/ratings/user/${userId}`);
      if (!res.ok) return;
      const data = await res.json();
      renderRatingSummary(data);
    } catch (err) {
      console.error(err);
    }
  }

  function renderRatingSummary(data) {
    const { average_stars, total_ratings, star_breakdown, ratings } = data;
    document.getElementById("avgStars").textContent = average_stars.toFixed(1);
    document.getElementById("totalReviewsCount").textContent = `${total_ratings} total review${total_ratings === 1 ? "" : "s"}`;
    
    // Star icons
    const fullStars = Math.round(average_stars);
    document.getElementById("starIcons").textContent = "★".repeat(fullStars) + "☆".repeat(5 - fullStars);

    // Breakdown bars
    const breakdownEl = document.getElementById("breakdownBars");
    breakdownEl.innerHTML = [5, 4, 3, 2, 1].map(star => {
      const count = star_breakdown[star] || 0;
      const pct = total_ratings > 0 ? (count / total_ratings * 100) : 0;
      return `
        <div class="bar-row">
          <span class="bar-label">${star} star</span>
          <div class="bar-track"><div class="bar-fill" style="width: ${pct}%;"></div></div>
          <span class="bar-val">${count}</span>
        </div>
      `;
    }).join("");

    // Reviews list
    const listEl = document.getElementById("reviewsList");
    if (!ratings || ratings.length === 0) {
      listEl.innerHTML = '<div style="color:#8DA9C4; padding:24px; text-align:center; background:#FFF; border-radius:12px; border:1px dashed #DDE5F0;">No feedback reviews received yet.</div>';
    } else {
      listEl.innerHTML = ratings.map(r => `
        <div class="review-card">
          <div class="review-top">
            <div class="review-author">${escapeHtml(r.from_user_name)}</div>
            <div class="review-stars">${"★".repeat(r.stars)}${"☆".repeat(5 - r.stars)}</div>
          </div>
          <div class="review-body">${escapeHtml(r.review)}</div>
          <div class="review-date">${new Date(r.created_at).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' })}</div>
        </div>
      `).join("");
    }
  }

  function setStars(n) {
    selectedStars = n;
    const spans = document.querySelectorAll("#starPicker span");
    spans.forEach((s, idx) => {
      if (idx < n) s.classList.add("active");
      else s.classList.remove("active");
    });
  }

  function openRatingModal(txId = "") {
    if (txId) document.getElementById("modalTxId").value = txId;
    document.getElementById("ratingModal").classList.add("visible");
  }

  function closeRatingModal() {
    document.getElementById("ratingModal").classList.remove("visible");
  }

  async function submitFeedback() {
    const txId = document.getElementById("modalTxId").value.trim();
    const review = document.getElementById("modalReview").value.trim();

    if (!txId) { alert("Please enter the Transaction ID."); return; }
    if (!review) { alert("Please enter your written review."); return; }

    try {
      const res = await fetch("/ratings/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": getToken(),
        },
        body: JSON.stringify({
          transaction_id: txId,
          stars: selectedStars,
          review: review,
        }),
      });

      if (!res.ok) {
        const err = await res.json();
        alert(err.detail || "Failed to submit rating.");
        return;
      }

      alert("Thank you! Your rating and feedback were submitted successfully.");
      closeRatingModal();
      loadUserRatings(currentUser.id);
    } catch (err) {
      alert("Could not reach the server.");
    }
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  guardPage();
</script>

</body>
</html>
