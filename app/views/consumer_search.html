<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RePlate - Consumer Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F7F9FC;
            --navy: #0B2545;
            --blue: #1D4ED8;
            --slate: #8DA9C4;
            --white: #FFFFFF;
            --green: #166534;
            --text: #243b53;
            --muted: #6b7a90;
            --card: #ffffff;
            --border: #dfeaf3;
            --shadow: 0 14px 35px rgba(15, 23, 42, 0.08);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; font-family: 'Inter', Arial, sans-serif; background: var(--bg); color: var(--navy);
        }
        .topbar {
            background: var(--navy); color: var(--white); padding: 18px 40px;
            display: flex; align-items: center; justify-content: space-between;
            gap: 16px;
        }
        .brand-mark { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 20px; }
        .brand-mark span { color: var(--slate); }
        .topbar-right {
            display: flex; align-items: center; gap: 16px; flex-wrap: nowrap;
        }
        .nav-links {
            display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;
            white-space: nowrap;
        }
        .nav-link, .logout-btn {
            background: transparent; border: 1.5px solid rgba(255,255,255,0.25); color: var(--white);
            padding: 7px 16px; border-radius: 7px; font-family: inherit; font-size: 13px; font-weight: 600;
            cursor: pointer; text-decoration: none; transition: all 0.15s ease; display: inline-block; line-height: 1.2;
            white-space: nowrap;
        }
        .nav-link:hover, .logout-btn:hover { border-color: var(--white); background: rgba(255,255,255,0.08); }
        .topbar-user {
            font-size: 13px; color: var(--white); background: transparent; border: 1.5px solid rgba(255,255,255,0.25);
            padding: 7px 16px; border-radius: 7px; font-family: inherit; font-weight: 600; cursor: pointer;
            line-height: 1.2; white-space: nowrap; transition: all 0.15s ease;
        }
        .page { max-width: 1100px; margin: 28px auto; padding: 0 18px 60px; }
        .page-header {
            display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 20px;
        }
        .page-header h1 {
            margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; letter-spacing: -0.01em;
        }
        .page-header p { color: #5A7189; font-size: 14px; margin-top: 6px; }
        .welcome-strip {
            display: flex; align-items: center; gap: 6px; margin: 0 0 10px;
            font-size: 15px; color: var(--muted);
        }
        .welcome-strip strong { color: var(--navy); }
        .panel {
            background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow);
            border-radius: 16px; padding: 20px; margin-bottom: 22px;
        }
        .filters {
            display: grid; grid-template-columns: 2fr 1.3fr 1.4fr 1.2fr 1.2fr 1.1fr; gap: 14px; align-items: end;
        }
        input, select, button {
            width: 100%; padding: 12px 13px; border-radius: 10px; border: 1px solid var(--border); font-size: 14px;
        }
        button.search-btn, button.filter-btn {
            background: var(--blue); color: white; border: none; font-weight: 700; cursor: pointer;
        }
        .history-btn {
            background: #e9f0ff; color: var(--navy); border: 1px solid #d9e4ff; font-weight: 700; cursor: pointer;
        }
        .grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px;
        }
        .card {
            background: white; border: 1px solid var(--border); border-radius: 16px; padding: 18px;
            display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow);
        }
        .meta { display: flex; justify-content: space-between; gap: 12px; }
        .food-name { margin: 0; font-size: 22px; }
        .badge {
            background: #eaf7ee; color: var(--green); border-radius: 999px; padding: 6px 10px; font-size: 11px; font-weight: 700;
        }
        .price-row { display: flex; align-items: center; gap: 8px; }
        .old-price { text-decoration: line-through; color: var(--muted); }
        .price { font-size: 28px; font-weight: 700; color: var(--blue); }
        .muted { color: var(--muted); font-size: 13px; }
        .actions { display: flex; gap: 10px; }
        .actions input { width: 80px; }
        .reserve-btn {
            flex: 1; background: var(--blue); color: white; border: none; font-weight: 700; cursor: pointer;
        }
        .waitlist-btn {
            width: 100%; border: 1px solid var(--border); background: #f8fbff; color: var(--navy); font-weight: 600; cursor: pointer;
        }
        .message {
            display: none; margin-top: 14px; border-radius: 10px; padding: 12px 14px; background: #edfdf3; color: #166534; font-weight: 600;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand-mark">RePlate<span>.</span></div>
        <div class="topbar-right">
            <div class="nav-links">
                <a class="nav-link" href="/consumer-search">Nearby Food</a>
                <a class="nav-link" href="/consumer-history">Transaction History</a>
                <a class="nav-link" href="/pickup-slots-view">Pickup Slots</a>
                <a class="nav-link" href="/recommendations-view">Recommendations</a>
            </div>
            <button id="userLabel" class="topbar-user" type="button" onclick="window.location.href='/dashboard'">Welcome</button>
            <button class="logout-btn" onclick="handleLogout()">Log out</button>
        </div>
    </header>

    <main class="page">
        <div class="welcome-strip">
            <span>Welcome,</span>
            <strong id="welcomeUser">there</strong>
        </div>
        <div class="page-header">
            <div>
                <h1>Nearby food discovery</h1>
                <p>Search for discounted food around you, reserve what you need, or join a waitlist.</p>
            </div>
        </div>

        <div class="panel">
            <div class="filters">
                <input id="searchInput" type="text" placeholder="Search Food" />
                <input id="maxPriceInput" type="number" min="0" max="1500" step="0.5" placeholder="Max price" />
                <input id="locationInput" type="text" placeholder="Location" />
                <input id="maxExpiryInput" type="number" min="1" step="1" placeholder="Max expiry (hrs)" />
                <input id="maxDistanceInput" type="number" min="0.1" step="0.5" placeholder="Within (km)" />
                <div style="display:flex; gap:10px;">
                    <button class="search-btn" onclick="searchByFoodName()">Search</button>
                    <button class="filter-btn" onclick="applyFilters()">Filter</button>
                </div>
            </div>
            <div id="message" class="message"></div>
        </div>

        <h2>Available Food</h2>
        <section id="resultsGrid" class="grid"></section>
    </main>

    <script>
        const token = () => localStorage.getItem('session_token');
        let userHasLocation = false;

        async function applyRoleNavAccess() {
            try {
                const authToken = token();
                if (!authToken) return;
                const res = await fetch('/auth/me', { headers: { 'Authorization': authToken } });
                if (!res.ok) return;
                const user = await res.json();

                userHasLocation = user.latitude != null && user.longitude != null;
                const displayName = user.name || user.email || 'User';
                const welcomeUser = document.getElementById('welcomeUser');
                const userLabel = document.getElementById('userLabel');
                if (welcomeUser) welcomeUser.textContent = displayName;
                if (userLabel) userLabel.textContent = `Welcome, ${displayName}`;

                const allowed = {
                    restaurant: ['/consumer-search', '/listings-view', '/pickup-slots-view', '/recommendations-view'],
                    ngo: ['/consumer-search', '/ngo-donations-view', '/pickup-slots-view', '/recommendations-view'],
                    consumer: ['/consumer-search', '/consumer-history', '/pickup-slots-view', '/recommendations-view'],
                    administrator: ['/consumer-search', '/marketplace', '/notifications-view'],
                };
                document.querySelectorAll('.nav-link').forEach((link) => {
                    const href = link.getAttribute('href');
                    if (!href || !allowed[user.role] || allowed[user.role].includes(href)) {
                        link.style.display = 'inline-block';
                        return;
                    }
                    link.style.display = 'none';
                });
            } catch (err) {
                // ignore and keep default nav visible
            }
        }

        function showMessage(text, isError = false) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.style.display = 'block';
            el.style.background = isError ? '#fee2e2' : '#edfdf3';
            el.style.color = isError ? '#991b1b' : '#166534';
        }

        function renderListing(listing) {
            const card = document.createElement('article');
            card.className = 'card';

            const remainingHours = listing.remaining_hours ?? 0;
            const badge = remainingHours > 24 ? 'Fresh' : remainingHours > 6 ? 'Limited' : 'Urgent';
            const price = Number(listing.discounted_price || 0).toFixed(2);
            const original = Number(listing.original_price || 0).toFixed(2);

            card.innerHTML = `
                <div class="meta">
                    <div>
                        <h2 class="food-name">${listing.food_name}</h2>
                        <div class="muted">${listing.category} • ${listing.restaurant_name || 'Restaurant'}</div>
                    </div>
                    <span class="badge">${badge}</span>
                </div>
                <div class="muted">${listing.pickup_location}</div>
                <div class="price-row">
                    <span class="old-price">$${original}</span>
                    <span class="price">$${price}</span>
                </div>
                <div class="muted">${listing.available_quantity} ${listing.unit} left • ${listing.remaining_hours}h left${listing.distance_km != null ? ` • ${listing.distance_km} km away` : ''}</div>
                <div class="actions">
                    <input type="number" id="qty-${listing.id}" min="1" max="${listing.available_quantity}" value="1" />
                    <button class="reserve-btn" onclick="reserveListing('${listing.id}')">Reserve</button>
                </div>
                <button class="waitlist-btn" onclick="joinWaitlist('${listing.id}')">Join waitlist</button>
            `;
            return card;
        }

        function searchByFoodName() {
            const search = document.getElementById('searchInput').value.trim();
            const params = new URLSearchParams();
            if (search) params.append('search', search);
            return loadListingsWithParams(params);
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.trim();
            const maxPrice = document.getElementById('maxPriceInput').value;
            const location = document.getElementById('locationInput').value.trim();
            const maxExpiryHours = document.getElementById('maxExpiryInput').value;
            const maxDistanceKm = document.getElementById('maxDistanceInput').value;
            const params = new URLSearchParams();
            if (search) params.append('search', search);
            if (maxPrice) params.append('max_price', maxPrice);
            if (location) params.append('location', location);
            if (maxExpiryHours) params.append('max_expiry_hours', maxExpiryHours);
            if (maxDistanceKm) params.append('max_distance_km', maxDistanceKm);
            if (maxDistanceKm && !userHasLocation) {
                requestLocationThenFilter(params);
                return;
            }
            return loadListingsWithParams(params);
        }

        function requestLocationThenFilter(params) {
            if (!navigator.geolocation) {
                showMessage('Geolocation is not supported by your browser.', true);
                return;
            }
            showMessage('Requesting your location to apply distance filter...');
            navigator.geolocation.getCurrentPosition(
                async (pos) => {
                    const { latitude, longitude } = pos.coords;
                    try {
                        const res = await fetch('/auth/me/location', {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json', 'Authorization': token() },
                            body: JSON.stringify({ latitude, longitude }),
                        });
                        if (res.ok) {
                            userHasLocation = true;
                            showMessage('Location saved! Applying distance filter...');
                            loadListingsWithParams(params);
                        } else {
                            showMessage('Unable to save location on server.', true);
                        }
                    } catch (e) {
                        showMessage('Network error while saving location.', true);
                    }
                },
                () => {
                    showMessage('Location access was denied. Please allow location access to filter by distance.', true);
                }
            );
        }

        async function handleLogout() {
            const authToken = token();
            if (authToken) {
                try { await fetch('/auth/logout', { method: 'POST', headers: { 'Authorization': authToken } }); } catch (err) {}
            }
            localStorage.removeItem('session_token');
            window.location.href = '/';
        }

        async function loadListings() {
            return loadListingsWithParams(new URLSearchParams());
        }

        applyRoleNavAccess();

        async function loadListingsWithParams(params) {
            const authToken = token();
            if (!authToken) {
                const grid = document.getElementById('resultsGrid');
                grid.innerHTML = '<div class="card"><p class="muted">Please log in to view and reserve food listings.</p></div>';
                return;
            }

            const res = await fetch(`/consumer/search?${params.toString()}`, {
                headers: { 'Authorization': authToken }
            });

            if (!res.ok) {
                const errData = await res.json().catch(() => ({}));
                showMessage(errData.detail || 'Unable to load food listings.', true);
                return;
            }

            const data = await res.json();
            const grid = document.getElementById('resultsGrid');
            grid.innerHTML = '';

            if (!data.length) {
                grid.innerHTML = '<div class="card"><p class="muted">No listings match your current search.</p></div>';
                return;
            }

            data.forEach(listing => grid.appendChild(renderListing(listing)));
        }

        async function reserveListing(listingId) {
            const qtyInput = document.getElementById('qty-' + listingId);
            const quantity = Number(qtyInput?.value || 1);

            const res = await fetch(`/consumer/listings/${listingId}/reserve?quantity=${quantity}`, {
                method: 'POST',
                headers: { 'Authorization': token() }
            });
            const body = await res.json();
            if (!res.ok) {
                showMessage(body.detail || 'Reservation failed.', true);
                return;
            }
            showMessage(`${body.message} Total: $${Number(body.total_amount).toFixed(2)}`);
            await loadListings();
        }

        async function joinWaitlist(listingId) {
            const res = await fetch(`/consumer/listings/${listingId}/waitlist`, {
                method: 'POST',
                headers: { 'Authorization': token() }
            });
            const body = await res.json();
            if (!res.ok) {
                showMessage(body.detail || 'Unable to join waitlist.', true);
                return;
            }
            showMessage(body.message || 'Joined waitlist successfully.');
        }

        async function logout() {
            const tokenValue = token();
            if (tokenValue) {
                await fetch('/auth/logout', { method: 'POST', headers: { 'Authorization': tokenValue } });
            }
            localStorage.removeItem('session_token');
            window.location.href = '/';
        }

        loadListings();
    </script>
</body>
</html>
